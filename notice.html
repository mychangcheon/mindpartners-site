<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공고 — 주식회사 마인드파트너스</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{--bg:#f6f3ee;--ink:#1c1b1a;--ink2:#4a4743;--ink3:#7a756e;--line:#e3ddd3;--card:#fff}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141311;--ink:#f3efe8;--ink2:#cfc8bd;--ink3:#9a938a;--line:#2b2824;--card:#1f1c19}}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.65}
  .wrap{max-width:760px;margin:0 auto;padding:48px 20px 80px}
  a{color:inherit}
  h1{font-size:28px;letter-spacing:-.02em;margin:0 0 6px}
  .muted{color:var(--ink3);font-size:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:26px}
  .card h2{font-size:17px;margin:0 0 6px}
  .card p{margin:0;color:var(--ink2)}
</style>
</head>
<body>
<div class="wrap">
  <a href="/" style="text-decoration:none;font-weight:700">&larr; 마인드파트너스</a>
  <h1 style="margin-top:18px">공고</h1>
  <div class="muted">주식회사 마인드파트너스의 법령·정관에 따른 공고를 이 페이지에 게시합니다.</div>
  <div class="card">
    <h2>현재 게시된 공고가 없습니다.</h2>
    <p>공고가 있을 때 이 자리에 제목·게시일·본문을 게시하며, 게시 기간 동안 유지합니다.</p>
  </div>
</div>
</body>
</html>
